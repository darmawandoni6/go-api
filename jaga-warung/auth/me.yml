info:
  name: me
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/auth/me"
  body:
    type: json
    data: ""
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        // Ambil data dari response body
        const responseBody = res.getBody();

        // Simpan access_token ke environment variable "token"
        // Gunakan { persist: true } agar nilai tersimpan ke file local.bru
        if (responseBody && responseBody.data && responseBody.data.access_token) {
            bru.setEnvVar("token", responseBody.data.access_token, { persist: true });
            console.log("Token berhasil disimpan ke Local Environment!");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
